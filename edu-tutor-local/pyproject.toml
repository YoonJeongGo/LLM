[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "edu-tutor-local"
version = "0.2.1"
description = "Local Korean teaching laboratory with evidence-aware validation"
requires-python = ">=3.11,<3.14"
dependencies = ["fastapi", "uvicorn", "pydantic", "python-multipart", "jsonschema", "PyYAML", "psutil", "filelock", "scikit-learn", "pypdf", "Pillow", "httpx", "sqlglot==30.12.0"]

[project.optional-dependencies]
test = ["pytest", "httpx"]
model = ["torch==2.9.1", "torchaudio==2.9.1", "torchvision==0.24.1", "transformers==4.57.3", "peft==0.18.1", "accelerate==1.12.0", "bitsandbytes==0.48.2", "qwen-tts==0.1.1", "soundfile", "safetensors", "tensorboard"]

[project.scripts]
edu-tutor = "edu_tutor.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"edu_tutor.lessons" = ["assets/*.json"]
"edu_tutor.speech" = ["*.ps1"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
markers = ["gpu: requires actual local GPU and weights", "tiny: real CPU LoRA wiring"]
